[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    migrations
  | \.venv
  | logs
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", ".venv", "logs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line length — handled by black
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "core", "tests"]

# Django startapp scaffold placeholders — ignored until modules are implemented
[tool.ruff.lint.per-file-ignores]
"apps/*/admin.py" = ["F401"]
"apps/*/models.py" = ["F401"]
"apps/*/tests.py" = ["F401"]
"apps/*/views.py" = ["F401"]
